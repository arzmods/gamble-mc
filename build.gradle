subprojects {
	apply plugin: 'java'

	version = project.mod_version
	group = project.maven_group

	repositories {
		mavenCentral()
	}

	// The gameplay code lives in common/ and is compiled into both loader jars,
	// so Fabric and NeoForge stay byte-for-byte identical in behaviour.
	sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
	sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

	tasks.withType(JavaCompile).configureEach {
		it.options.release = Integer.parseInt(project.java_version)
	}

	java {
		sourceCompatibility = JavaVersion.toVersion(project.java_version)
		targetCompatibility = JavaVersion.toVersion(project.java_version)
	}
}
