name: Inspect MC API

on:
  push:
    branches: [ 'claude/**' ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.6.0

      - name: Produce Minecraft artifacts
        run: ./gradlew :neoforge:createMinecraftArtifacts --no-daemon

      - name: Inspect API
        run: |
          find /home/runner/work ~/.gradle -name '*.jar' 2>/dev/null > /tmp/jars.txt
          MC=""; NF=""
          while read -r j; do
            L=$(unzip -l "$j" 2>/dev/null) || continue
            if [ -z "$MC" ] && echo "$L" | grep -q 'net/minecraft/server/level/ServerPlayer.class'; then MC="$j"; fi
            if [ -z "$NF" ] && echo "$L" | grep -q 'net/neoforged/neoforge/common/NeoForge.class'; then NF="$j"; fi
            if [ -n "$MC" ] && [ -n "$NF" ]; then break; fi
          done < /tmp/jars.txt
          echo "### MC=$MC"
          echo "### NF=$NF"
          mkdir -p /tmp/mc && cd /tmp/mc && unzip -o -q "$MC" >/dev/null 2>&1 || true
          echo "===== ServerPlayer drop/kill/hurt ====="
          javap -p net/minecraft/server/level/ServerPlayer.class 2>/dev/null | grep -Ei 'drop|kill|hurt'
          echo "===== Player drop ====="
          javap -p net/minecraft/world/entity/player/Player.class 2>/dev/null | grep -Ei 'drop'
          echo "===== Prediction classes ====="
          find . -name 'Prediction*.class' | head -20
          echo "===== InputConstants\$Type ====="
          javap -p 'com/mojang/blaze3d/platform/InputConstants$Type.class' 2>/dev/null
          echo "===== InputConstants keys sample ====="
          javap -p com/mojang/blaze3d/platform/InputConstants.class 2>/dev/null | grep -E 'KEY_G|Type ' | head -20
          echo "===== KeyMapping ====="
          javap -p net/minecraft/client/KeyMapping.class 2>/dev/null | head -40
          echo "===== KeyMapping\$Category ====="
          javap -p 'net/minecraft/client/KeyMapping$Category.class' 2>/dev/null | head -20
          echo "===== Inventory add/place ====="
          javap -p net/minecraft/world/entity/player/Inventory.class 2>/dev/null | grep -Ei 'add|place|setItem|getItem|ContainerSize'
          echo "===== NeoForge event classes ====="
          mkdir -p /tmp/nf && cd /tmp/nf && unzip -o -q "$NF" >/dev/null 2>&1 || true
          for c in net/neoforged/neoforge/event/tick/ServerTickEvent net/neoforged/neoforge/client/event/ClientTickEvent net/neoforged/neoforge/network/event/RegisterPayloadHandlersEvent net/neoforged/neoforge/network/registration/PayloadRegistrar net/neoforged/neoforge/network/PacketDistributor net/neoforged/neoforge/client/event/RegisterKeyMappingsEvent; do
            echo "--- $c ---"
            ls ${c}*.class 2>/dev/null || echo "MISSING"
            javap -p ${c}.class 2>/dev/null | head -15
          done
