name: Inspect MC API

on:
  push:
    branches: [ 'claude/**' ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.6.0

      - name: Produce Minecraft artifacts
        run: ./gradlew :neoforge:createMinecraftArtifacts --no-daemon

      - name: Inspect API
        run: |
          MC=/home/runner/work/gamble-mc/gamble-mc/neoforge/build/moddev/artifacts/minecraft-patched-26.3.0.4-beta.jar
          mkdir -p /tmp/mc && cd /tmp/mc && unzip -o -q "$MC" 'net/minecraft/util/Prediction*' 'net/minecraft/world/entity/item/ItemEntity*' >/dev/null 2>&1 || true
          echo "@@@ Prediction"
          javap -p net/minecraft/util/Prediction.class 2>&1 | grep -v 'lambda\$\|private static.*\$VALUES\|static {}'
          echo "@@@ ItemEntity ctors"
          javap -p net/minecraft/world/entity/item/ItemEntity.class 2>&1 | grep -E 'ItemEntity\(|setPickUpDelay'
